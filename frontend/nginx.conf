# $request_uri is the RAW request line, before nginx normalizes it.
#
# That matters more here than in a typical app. nginx decodes and collapses the URI it
# matches locations against, so /api/https://example.com becomes https:/example.com with
# a single slash — and %2F inside a target URL would be decoded into a real separator.
# Rebuilding the upstream path from $request_uri keeps the crawl target byte-for-byte.
map $request_uri $api_uri {
    ~^/api(/.*)$  $1;
    default       /;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved rather than resolved once at startup.
    #
    # A statically named upstream is resolved when nginx loads its config and then cached
    # forever, so recreating the backend — which compose does on every rebuild — leaves
    # this proxying to an address nothing is listening on. The failure looks exactly like
    # the backend being down. Assigning the host to a variable is what forces nginx to
    # use this resolver per request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The bundle is content-hashed by Vite, so it can be cached hard. index.html cannot.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Saved screenshots and downloaded page images, at the exact paths the API puts in its
    # responses. Without these the SPA fallback above would answer /instant-images/x.jpg
    # with index.html and a 200, so a missing image would render as a broken box rather
    # than a 404 — and markdown copied out of the console would silently not resolve.
    location /instant-screenshots/ {
        set $upstream backend:3000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
    }

    location /instant-images/ {
        set $upstream backend:3000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
    }

    # The API, same-origin, so the browser never needs CORS in this deployment.
    #
    # $api_uri drops the /api prefix. Stripping it is required, not cosmetic: the backend's
    # catch-all treats any unmatched path as a URL to crawl, so a forwarded
    # /api/https://example.com would be read as a request to fetch a host called `api`.
    location /api/ {
        set $upstream backend:3000;
        proxy_pass http://$upstream$api_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crawling a slow page, reading a page's images, and search reading its results all
        # take far longer than nginx's 60s default, which would surface as a 504 mid-crawl.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Reader responses stream in; buffering them adds latency for no benefit.
        proxy_buffering off;
    }
}
