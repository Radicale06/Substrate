# Builds every image in the stack and publishes it to the GitHub Container Registry.
#
#   ghcr.io/radicale06/substrate-<component>:latest
#
# SearXNG is absent on purpose: that service runs the upstream searxng/searxng image and
# this repository only supplies its settings.yml, so there is nothing of ours to publish.
# The vendored Supabase stack is absent for the same reason, one level up — it is not even
# committed here.

name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One failure should not hide the state of the other six.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: reader
            context: ./services/reader
          - name: segmenter
            context: ./services/segmenter
          - name: vectors
            context: ./services/vectors
          - name: embeddings
            context: ./services/embeddings
          - name: reranker
            context: ./services/reranker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Skipped for pull requests: a PR from a fork has no permission to write packages,
      # and the build itself is still worth running as a check.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase path, and the owner here is mixed case.
      - name: Resolve the image name
        id: image
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/substrate-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only, deliberately. Three of these images carry Chrome or torch, and
          # cross-building those under QEMU takes hours and regularly times out; the rest
          # are only kept in step with them so every image in the stack has the same
          # platform support rather than a table of exceptions. The upgrade path is native
          # arm64 runners (ubuntu-24.04-arm), not more emulation.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
