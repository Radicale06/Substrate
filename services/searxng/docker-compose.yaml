# SearXNG — the search backend behind /v1/search.
#
# Runs standalone from this folder, or as part of the root stack:
#   docker compose up            (from services/searxng)
#   docker compose up            (from the repo root, which includes this file)

services:
  searxng:
    image: searxng/searxng:latest
    container_name: substrate-searxng
    restart: unless-stopped
    volumes:
      # Enables the JSON API, which SearXNG ships disabled.
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORT:-8080}/"
      # Replaces the placeholder in settings.yml. Set your own before exposing this.
      SEARXNG_SECRET: "${SEARXNG_SECRET:-substrate-local-development-secret}"
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    networks:
      - substrate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  substrate:
    name: substrate
